; Optional developer wrapper around the same ESP-IDF CMake project.  The
; canonical build is `idf.py`; this file is useful on machines which already
; use PlatformIO and will pull framework-espidf into the local cache.
[env:esp32s3]
platform = espressif32 @ 6.7.0
board = esp32-s3-devkitc-1
framework = espidf
src_dir = main
monitor_speed = 115200
board_build.partitions = partitions.csv
